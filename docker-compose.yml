services:
  db:
    image: postgres:15
    container_name: lzt_db
    restart: unless-stopped
    # Only the database credentials are passed to Postgres, not the bot tokens.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Not published to the host; uncomment to access it locally only.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - lzt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bot_network

  bot:
    build: .
    container_name: lzt_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network
    volumes:
      - lzt_logs:/app/logs

networks:
  bot_network:
    driver: bridge

volumes:
  lzt_db_data:
  lzt_logs:
