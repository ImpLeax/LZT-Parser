[project]
name = "lzt-bot"
version = "0.1.0"
description = "Telegram bot that monitors the LZT Market for CS2 Steam accounts matching custom filters and posts new listings to a chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "asyncpg>=0.31.0",
    "colorama>=0.4.6",
    "lolzteam[async]>=2.2.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "handlers", "loader", "lzt", "services", "utils"]
